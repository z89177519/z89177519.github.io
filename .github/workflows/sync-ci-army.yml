name: Sync CI Army IP List

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）同步一次
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Fetch CI Army IP list
        id: fetch
        run: |
          mkdir -p static/txt
          HTTP_CODE=0
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sSfL --connect-timeout 30 --max-time 120 \
              -o static/txt/ci-army.txt \
              -w "%{http_code}" \
              "https://cinsscore.com/list/ci-badguys.txt" 2>/dev/null) && break
            echo "Attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::All 3 fetch attempts failed (last HTTP code: $HTTP_CODE)"
            exit 1
          fi
          COUNT=$(wc -l < static/txt/ci-army.txt)
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::Fetched only $COUNT IPs, something is wrong — aborting"
            exit 1
          fi
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "{\"lastSync\":\"$NOW\",\"ipCount\":$COUNT,\"source\":\"cinsscore.com/list/ci-badguys.txt\"}" > static/txt/ci-army-meta.json
          echo "Fetched $COUNT IPs at $NOW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/txt/ci-army.txt static/txt/ci-army-meta.json
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
            exit 0
          fi
          git commit -m "chore: sync CI Army IP list"
          # 先拉取远程最新，避免冲突
          git pull --rebase origin master
          # 推送，失败重试最多 3 次
          for i in 1 2 3; do
            if git push origin master; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
