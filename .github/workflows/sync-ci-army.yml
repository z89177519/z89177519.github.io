name: Sync CI Army IP List

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）同步一次
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch CI Army IP list
        run: |
          mkdir -p static/txt
          for i in 1 2 3; do
            curl -sSf --connect-timeout 30 --max-time 120 \
              -o static/txt/ci-army.txt \
              "https://cinsscore.com/list/ci-badguys.txt" && break
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          COUNT=$(wc -l < static/txt/ci-army.txt)
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "{\"lastSync\":\"$NOW\",\"ipCount\":$COUNT,\"source\":\"cinsscore.com/list/ci-badguys.txt\"}" > static/txt/ci-army-meta.json
          echo "Fetched $COUNT IPs at $NOW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/txt/ci-army.txt static/txt/ci-army-meta.json
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore: sync CI Army IP list [skip ci]"
            git push
          fi
