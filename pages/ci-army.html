<script>
(function() {
  function formatDate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function loadSyncTime(file, elId, fallback) {
    var el = document.getElementById(elId);
    fetch('https://api.github.com/repos/z89177519/z89177519.github.io/commits?path=static/txt/' + file + '&page=1&per_page=1')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        el.textContent = '最后同步：' + formatDate(new Date(data[0].commit.committer.date));
      })
      .catch(function() {
        el.textContent = fallback;
      });
  }

  loadSyncTime('ci-army.txt', 'syncTime-ci-army', '恶意IP黑名单，每小时自动同步');
  loadSyncTime('blocklist-de.txt', 'syncTime-blocklist-de', '等待首次同步...');
})();
</script>
