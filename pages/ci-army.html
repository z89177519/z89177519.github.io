          <a href="{{ site.baseurl }}/static/txt/ci-army.txt" class="hover-underline">CI Army 恶意IP列表</a>

          <span class="separator" id="ciSyncTime">加载中...</span>

<script>
(function() {
  var el = document.getElementById('ciSyncTime');
  fetch('https://api.github.com/repos/z89177519/z89177519.github.io/commits?path=static/txt/ci-army.txt&page=1&per_page=1')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var d = new Date(data[0].commit.committer.date);
      el.textContent = '最后同步：' + d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
    })
    .catch(function() {
      el.textContent = '恶意IP黑名单，每小时自动同步';
    });
})();
</script>
