<script>
(function() {
  function formatDate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }

  function loadMeta(metaUrl, elId, fallback) {
    var el = document.getElementById(elId);
    fetch(metaUrl)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        el.textContent = '最后同步：' + formatDate(new Date(data.lastSync)) +
          ' · ' + data.ipCount.toLocaleString() + '条IP';
      })
      .catch(function() {
        el.textContent = fallback;
      });
  }

  loadMeta('{{ site.baseurl }}/static/txt/ci-army-meta.json', 'syncTime-ci-army', '等待首次同步...');
  loadMeta('{{ site.baseurl }}/static/txt/blocklist-de-meta.json', 'syncTime-blocklist-de', '等待首次同步...');
})();
</script>
